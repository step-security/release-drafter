name: Node & npm setup
author: step-security
description: 'Common job setup for npm managed repo'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: .node-version
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci
